name: Full Build (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag ou commit para compilar
        required: true
        default: main
        type: string
      include_ui_tests:
        description: Incluir testes que abrem janelas WebView2
        required: false
        default: false
        type: boolean
      include_store_packages:
        description: Compilar também MSIX e MSIXBundle para a Microsoft Store
        required: false
        default: false
        type: boolean
      run_wack:
        description: Executar o Windows App Certification Kit
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: full-build-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compilação manual sem publicação
    runs-on: windows-latest
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Configurar .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Cache de pacotes NuGet
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json', 'NuGet.config', 'Directory.Build.props', 'Version.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Validar versão
        id: version
        shell: pwsh
        run: ./tools/version.ps1 validate -GitHubOutput

      - name: Validar repositório e histórico
        shell: pwsh
        run: |
          ./tools/check-repository.ps1 -SkipSecrets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/check-secrets.ps1 -IncludeHistory
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Baixar ativos de mídia verificados
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./release/Get-MediaAssets.ps1 -Repository ${{ github.repository }}

      - name: Restaurar e compilar testes
        shell: pwsh
        run: |
          dotnet restore tests/Organessonium.NetworkTests/Organessonium.NetworkTests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/Organessonium.NetworkTests/Organessonium.NetworkTests.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compilar distribuição
        shell: pwsh
        run: |
          $parameters = @{}
          if ('${{ inputs.include_store_packages }}' -ne 'true') { $parameters.SkipStorePackages = $true }
          if ('${{ inputs.run_wack }}' -eq 'true') { $parameters.RunWack = $true }
          ./release/Build-Releases.ps1 @parameters

      - name: Validar metadados de versão dos executáveis
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          $directory = "artifacts/releases/$env:VERSION-build.$env:BUILD"
          Get-ChildItem -LiteralPath $directory -Filter 'Organessonium-*.exe' -File | ForEach-Object {
            ./tools/check-version-metadata.ps1 -Path $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Validar artefatos e checksums
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          $parameters = @{ ArtifactDirectory = "artifacts/releases/$env:VERSION-build.$env:BUILD" }
          if ('${{ inputs.include_store_packages }}' -ne 'true') { $parameters.SkipStorePackages = $true }
          ./release/Test-ReleaseArtifacts.ps1 @parameters

      - name: Armazenar artefatos para análise
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: organessonium-${{ steps.version.outputs.version }}-build.${{ steps.version.outputs.build }}
          path: artifacts/releases/${{ steps.version.outputs.version }}-build.${{ steps.version.outputs.build }}/**
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      # A suíte roda depois do upload para que uma falha de teste não impeça a
      # análise dos artefatos. O job continua vermelho quando os testes falham.
      - name: Testes rápidos
        shell: pwsh
        run: |
          $parameters = @{ Configuration = 'Release'; SkipMedia = $true; NoRestore = $true; NoBuild = $true }
          if ('${{ inputs.include_ui_tests }}' -eq 'true') { $parameters.IncludeUi = $true }
          ./tools/run-tests.ps1 @parameters
